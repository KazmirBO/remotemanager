[package]
name = "keygrab"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Bez `workspace = true`: workspace zabrania `unsafe` (`unsafe_code = "forbid"`), a ten crate
# potrzebuje go w jednym, cienkim module `win`. Pozostałe lint-y jak w workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_WindowsAndMessaging",
] }
