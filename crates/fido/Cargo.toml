[package]
name = "fido"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

# Bez `workspace = true`: workspace zabrania `unsafe` (`unsafe_code = "forbid"`), a ten crate
# potrzebuje go w jednym module `win` (systemowe API WebAuthn). Poza Windows `unsafe` jest
# zabronione atrybutem w `lib.rs`. Pozostałe lint-y jak w workspace.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
getrandom = "0.4.3"
hmac = "0.13.0"
sha2 = "0.11.1"
thiserror = "2.0.21"
zeroize = "1.9.1"

# Linux: klucz przez USB HID (hidraw). Biblioteka wymaga nagłówków libudev przy budowie.
# Na Windows dostęp do HID kluczy FIDO wymaga uprawnień administratora, dlatego tam używamy
# systemowego API.
[target.'cfg(target_os = "linux")'.dependencies]
ctap-hid-fido2 = "3.6.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", default-features = false, features = [
    "Win32_Foundation",
    "Win32_Networking_WindowsWebServices",
] }
