<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>RDP pełny ekran</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="width: 1280px; height: 720px; position: relative; overflow: hidden; background: #3A3A3A; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">

  <div style="position: absolute; left: 140px; top: 120px; width: 700px; height: 400px; background: #E8E8E8; border: 1px solid #1A1A1A; box-shadow: 0 8px 24px rgba(0,0,0,0.5); color: #1A1A1A">
    <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 12px; min-height: 30px; background: #CFCFCF; font-size: 12px; font-weight: 600"><span>Eksplorator - D:\Kopie</span><span>_ &#9633; x</span></div>
    <div style="padding: 16px; display: flex; flex-direction: column; gap: 8px; font-size: 12px"><span>veeam_2026-10-11.vbk</span><span>veeam_2026-10-10.vib</span><span>veeam_2026-10-09.vib</span></div>
  </div>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; min-height: 44px; background: #1A1A1A; font-size: 12px"><span>&#9638;&nbsp;&nbsp;Eksplorator</span><span>14:32&nbsp;&nbsp;2026-10-12</span></div>

  <div role="toolbar" aria-label="Pasek sesji pełnoekranowej" style="position: absolute; left: 50%; top: 0; transform: translateX(-50%); display: flex; align-items: center; gap: 4px; padding: 6px 8px; background: #161616; border: 1px solid #3A3A3A; border-top: 0; border-radius: 0 0 8px 8px; box-shadow: 0 6px 20px rgba(0,0,0,0.5)">
    <div style="display: flex; align-items: center; gap: 8px; padding: 0 10px 0 6px; margin-right: 4px; border-right: 1px solid #2C2C2C">
      <span style="box-sizing: border-box; min-width: 34px; padding: 1px 4px; border: 1px solid #A0A0A0; border-radius: 3px; font-size: 10px; font-weight: 600; text-align: center">RDP</span>
      <span style="font-size: 13px; font-weight: 500">veeam</span>
    </div>
    <sc-for list="{{tools}}" as="b" hint-placeholder-count="6">
      <button type="button" aria-label="{{b.label}}" title="{{b.label}}" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 1px solid {{b.border}}; border-radius: 6px; background: {{b.bg}}; color: #EDEDED; cursor: pointer">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{b.icon}}"/></svg>
      </button>
    </sc-for>
    <button type="button" style="min-height: 32px; margin-left: 6px; padding: 0 12px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 12px; font-weight: 600; cursor: pointer">Wyjdź z pełnego ekranu</button>
  </div>

  <div style="position: absolute; left: 50%; top: 64px; transform: translateX(-50%); padding: 6px 12px; background: #161616; border: 1px solid #2C2C2C; border-radius: 6px; font-size: 12px; color: #A0A0A0">Pasek chowa się po 3 s. Najedź na górną krawędź ekranu, aby go pokazać. Skrót: Ctrl+Alt+Enter.</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() {
    const tools = [
      { label: 'Przypnij pasek', icon: 'M9 4h6l-1 6 3 3H7l3-3zM12 13v7', on: true },
      { label: 'Ctrl+Alt+Del', icon: 'M3 6h18a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H3a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1zM7 14h10' },
      { label: 'Schowek', icon: 'M9 4h6v3H9zM7 5H6a1 1 0 0 0-1 1v14a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V6a1 1 0 0 0-1-1h-1' },
      { label: 'Monitory', icon: 'M2 6h12v9H2zM6 19h4M8 15v4M16 9h6v9h-6z' },
      { label: 'Skala', icon: 'M4 9V4h5M20 15v5h-5M4 4l6 6M20 20l-6-6' },
      { label: 'Rozłącz', icon: 'M9 7H7a4 4 0 0 0 0 8h2M15 7h2a4 4 0 0 1 0 8h-2M3 3l18 18' }
    ].map((b) => ({ ...b, bg: b.on ? '#262626' : 'transparent', border: b.on ? '#3A3A3A' : 'transparent' }));
    return { accent: this.props.accent ?? '#EDEDED', tools };
  }
}
</script>
</body>
</html>
