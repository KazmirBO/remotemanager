<html lang="pl">
<head>
<meta charset="utf-8">
<title>Biblioteka ikon</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 1120px; box-sizing: border-box; display: flex; flex-direction: column; gap: 20px; padding: 40px; background: #0F0F0F; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">

  <div>
    <div style="font-size: 18px; font-weight: 600">Biblioteka ikon</div>
    <div style="margin-top: 4px; font-size: 13px; color: #A0A0A0">Siatka 24x24, obrys 1,75, zakończenia i łączenia zaokrąglone, kolor z currentColor. Każda ikona to jedna ścieżka w pliku .svg o tej samej nazwie. Komplet: {{count}} ikon.</div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(8, minmax(0, 1fr)); gap: 10px">
    <sc-for list="{{icons}}" as="i" hint-placeholder-count="48">
      <div style="display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 14px 6px 10px; background: #161616; border: 1px solid #2C2C2C; border-radius: 8px">
        <div style="display: flex; align-items: center; gap: 14px; min-height: 28px">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{i.d}}"/></svg>
        </div>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 10px; color: #A0A0A0; text-align: center; overflow-wrap: anywhere">{{i.name}}</span>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
