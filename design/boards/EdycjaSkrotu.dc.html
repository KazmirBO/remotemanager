<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Edycja skrótu</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="width: 480px; height: 420px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; padding: 16px 24px; border-bottom: 1px solid #2C2C2C">
    <div style="font-size: 16px; font-weight: 600">Zmień skrót</div>
    <div style="margin-top: 4px; color: #A0A0A0">Akcja: Zamknij kartę</div>
  </div>

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; gap: 14px; padding: 20px 24px">
    <div role="group" aria-label="Nowy skrót" style="display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px; min-height: 96px; border: 1px dashed #3A3A3A; border-radius: 8px; background: #0F0F0F">
      <div style="display: flex; align-items: center; gap: 6px">
        <sc-for list="{{keys}}" as="k" hint-placeholder-count="3">
          <kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 32px; height: 30px; box-sizing: border-box; padding: 0 10px; border: 1px solid #3A3A3A; border-bottom-width: 2px; border-radius: 5px; background: #1C1C1C; font-family: inherit; font-size: 13px">{{k.label}}</kbd>
        </sc-for>
      </div>
      <span style="font-size: 12px; color: #A0A0A0">Naciśnij nowe połączenie klawiszy. Esc anuluje.</span>
    </div>

    <sc-if value="{{ collision }}" hint-placeholder-val="{{ true }}">
      <div role="alert" style="display: flex; gap: 10px; padding: 10px 12px; border: 1px solid #EDEDED; border-radius: 6px; background: #1C1C1C; font-size: 13px">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
        <span>Ctrl+Shift+W jest już przypisany do akcji „Zamknij wszystkie karty”. Zapis przeniesie skrót do tej akcji.</span>
      </div>
    </sc-if>
    <sc-if value="{{ free }}" hint-placeholder-val="{{ false }}">
      <div style="padding: 10px 12px; border: 1px solid #2C2C2C; border-radius: 6px; background: #1C1C1C; color: #A0A0A0; font-size: 13px">Ten skrót nie jest używany przez żadną inną akcję.</div>
    </sc-if>
  </div>

  <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 8px 16px; padding: 14px 24px; border-top: 1px solid #2C2C2C">
    <button type="button" style="min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: transparent; color: #EDEDED; font-size: 13px; cursor: pointer">Przywróć domyślny</button>
    <div style="display: flex; gap: 8px">
      <button type="button" style="min-height: 36px; padding: 0 16px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; font-weight: 500; cursor: pointer">Anuluj</button>
      <button type="button" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 13px; font-weight: 600; cursor: pointer">{{saveLabel}}</button>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"collision":{"editor":"boolean","default":true},"$preview":{"width":480,"height":420}}'>
class Component extends DCLogic {
  renderVals() {
    const collision = this.props.collision ?? true;
    return {
      accent: this.props.accent ?? '#EDEDED',
      collision,
      free: !collision,
      saveLabel: collision ? 'Przenieś i zapisz' : 'Zapisz',
      keys: [{ label: 'Ctrl' }, { label: 'Shift' }, { label: 'W' }]
    };
  }
}
</script>
</body>
</html>
