<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Ściągawka skrótów</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 760px; height: 600px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-bottom: 1px solid #2C2C2C">
    <div><div style="font-size: 16px; font-weight: 600">Skróty klawiszowe</div><div style="margin-top: 2px; font-size: 12px; color: #A0A0A0">Ctrl+/ otwiera tę ściągawkę. Skróty można zmienić w Ustawieniach.</div></div>
    <button type="button" aria-label="Zamknij" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 24px 40px; padding: 20px 24px">
    <sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
      <div style="display: flex; flex-direction: column; gap: 2px">
        <div style="margin-bottom: 4px; font-size: 12px; font-weight: 600; color: #A0A0A0">{{g.title}}</div>
        <sc-for list="{{g.items}}" as="i" hint-placeholder-count="5">
          <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 30px; border-bottom: 1px solid #2C2C2C">
            <span style="font-size: 13px">{{i.label}}</span>
            <span style="display: flex; gap: 4px">
              <sc-for list="{{i.keys}}" as="k" hint-placeholder-count="2"><kbd style="display: inline-flex; align-items: center; justify-content: center; min-width: 22px; height: 22px; box-sizing: border-box; padding: 0 6px; border: 1px solid #3A3A3A; border-bottom-width: 2px; border-radius: 4px; background: #1C1C1C; font-family: inherit; font-size: 11px">{{k}}</kbd></sc-for>
            </span>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":760,"height":600}}'>
class Component extends DCLogic {
  renderVals() {
    const it = (label, keys) => ({ label, keys: keys.split('+') });
    return { groups: [
      { title: 'Ogólne', items: [it('Szybkie łączenie', 'Ctrl+K'), it('Nowy host', 'Ctrl+N'), it('Nowy katalog', 'Ctrl+Shift+N'), it('Ustawienia', 'Ctrl+,'), it('Zablokuj hosty', 'Ctrl+L'), it('Ta ściągawka', 'Ctrl+/')] },
      { title: 'Karty', items: [it('Następna karta', 'Ctrl+Tab'), it('Poprzednia karta', 'Ctrl+Shift+Tab'), it('Karta 1-9', 'Ctrl+1'), it('Zamknij kartę', 'Ctrl+W'), it('Duplikuj kartę', 'Ctrl+Shift+D'), it('Połącz ponownie', 'Ctrl+R')] },
      { title: 'Drzewo hostów', items: [it('Szukaj', 'Ctrl+F'), it('Połącz z zaznaczonym', 'Enter'), it('Edytuj', 'F2'), it('Usuń', 'Del'), it('Zwiń lub rozwiń', 'Spacja'), it('Pokaż lub ukryj panel', 'Ctrl+B')] },
      { title: 'Terminal i RDP', items: [it('Szukaj w buforze', 'Ctrl+Shift+F'), it('Kopiuj', 'Ctrl+Shift+C'), it('Wklej', 'Ctrl+Shift+V'), it('Pełny ekran RDP', 'Ctrl+Alt+Enter'), it('Zwolnij mysz z RDP', 'Ctrl+Alt+Home'), it('Powiększ czcionkę', 'Ctrl+=')] }
    ] };
  }
}
</script>
</body>
</html>
