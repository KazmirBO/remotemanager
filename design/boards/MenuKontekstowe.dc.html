<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Menu kontekstowe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; display: flex; gap: 40px; padding: 40px; background: #0F0F0F; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 600; color: #A0A0A0">Menu katalogu</div>
    <div style="position: relative; flex: 1 1 auto; box-sizing: border-box; padding: 8px 0; background: #161616; border: 1px solid #2C2C2C; border-radius: 8px">
      <sc-for list="{{treeA}}" as="row" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 {{row.pad}}px; background: {{row.bg}}">
          <sc-if value="{{ row.isFolder }}" hint-placeholder-val="{{ true }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; transform: rotate({{row.rot}}deg)"><path d="M9 6l6 6-6 6"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span style="font-weight: 500">{{row.name}}</span>
          </sc-if>
          <sc-if value="{{ row.isHost }}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; width: 14px"></span>
            <sc-if value="{{ row.isSsh }}" hint-placeholder-val="{{ false }}">
              <span style="flex: none; box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid {{accent}}; border-radius: 3px; background: {{accent}}; color: #0F0F0F; font-size: 11px; font-weight: 600; text-align: center">SSH</span>
            </sc-if>
            <sc-if value="{{ row.isRdp }}" hint-placeholder-val="{{ true }}">
              <span style="flex: none; box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid #A0A0A0; border-radius: 3px; color: #EDEDED; font-size: 11px; font-weight: 600; text-align: center">RDP</span>
            </sc-if>
            <span>{{row.name}}</span>
          </sc-if>
        </div>
      </sc-for>

      <div role="menu" aria-label="Menu katalogu" style="position: absolute; top: 56px; left: 150px; width: 270px; box-sizing: border-box; padding: 6px; background: #1C1C1C; border: 1px solid #3A3A3A; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5)">
        <sc-for list="{{menuA}}" as="m" hint-placeholder-count="8">
          <sc-if value="{{ m.isSep }}" hint-placeholder-val="{{ false }}">
            <div style="height: 1px; margin: 6px 4px; background: #2C2C2C"></div>
          </sc-if>
          <sc-if value="{{ m.isItem }}" hint-placeholder-val="{{ true }}">
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 32px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 5px; background: {{m.bg}}; color: #EDEDED; font-size: 14px; text-align: left; cursor: pointer">
              <span>{{m.label}}</span>
              <span style="font-size: 12px; color: #A0A0A0">{{m.key}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </div>

  <div style="flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; gap: 10px">
    <div style="font-size: 12px; font-weight: 600; color: #A0A0A0">Menu hosta</div>
    <div style="position: relative; flex: 1 1 auto; box-sizing: border-box; padding: 8px 0; background: #161616; border: 1px solid #2C2C2C; border-radius: 8px">
      <sc-for list="{{treeB}}" as="row" hint-placeholder-count="6">
        <div style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 12px 0 {{row.pad}}px; background: {{row.bg}}">
          <sc-if value="{{ row.isFolder }}" hint-placeholder-val="{{ true }}">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex: none; transform: rotate({{row.rot}}deg)"><path d="M9 6l6 6-6 6"/></svg>
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>
            <span style="font-weight: 500">{{row.name}}</span>
          </sc-if>
          <sc-if value="{{ row.isHost }}" hint-placeholder-val="{{ false }}">
            <span style="flex: none; width: 14px"></span>
            <sc-if value="{{ row.isSsh }}" hint-placeholder-val="{{ false }}">
              <span style="flex: none; box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid {{accent}}; border-radius: 3px; background: {{accent}}; color: #0F0F0F; font-size: 11px; font-weight: 600; text-align: center">SSH</span>
            </sc-if>
            <sc-if value="{{ row.isRdp }}" hint-placeholder-val="{{ true }}">
              <span style="flex: none; box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid #A0A0A0; border-radius: 3px; color: #EDEDED; font-size: 11px; font-weight: 600; text-align: center">RDP</span>
            </sc-if>
            <span>{{row.name}}</span>
          </sc-if>
        </div>
      </sc-for>

      <div role="menu" aria-label="Menu hosta" style="position: absolute; top: 128px; left: 120px; width: 290px; box-sizing: border-box; padding: 6px; background: #1C1C1C; border: 1px solid #3A3A3A; border-radius: 8px; box-shadow: 0 8px 24px rgba(0, 0, 0, 0.5)">
        <sc-for list="{{menuB}}" as="m" hint-placeholder-count="8">
          <sc-if value="{{ m.isSep }}" hint-placeholder-val="{{ false }}">
            <div style="height: 1px; margin: 6px 4px; background: #2C2C2C"></div>
          </sc-if>
          <sc-if value="{{ m.isItem }}" hint-placeholder-val="{{ true }}">
            <button type="button" role="menuitem" style="display: flex; align-items: center; justify-content: space-between; gap: 16px; width: 100%; min-height: 32px; box-sizing: border-box; padding: 0 10px; border: 0; border-radius: 5px; background: {{m.bg}}; color: #EDEDED; font-size: 14px; text-align: left; cursor: pointer">
              <span>{{m.label}}</span>
              <span style="font-size: 12px; color: #A0A0A0">{{m.key}}</span>
            </button>
          </sc-if>
        </sc-for>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';

    const tree = (selected) => [
      { name: 'FIRMA', depth: 0, type: 'folder' },
      { name: 'Kontrolery domeny', depth: 1, type: 'folder' },
      { name: 'dc01', depth: 2, type: 'rdp' },
      { name: 'dc02', depth: 2, type: 'rdp' },
      { name: 'Monitoring', depth: 1, type: 'folder' },
      { name: 'zabbix', depth: 2, type: 'ssh' },
      { name: 'wazuh', depth: 2, type: 'ssh' }
    ].map((n) => ({
      name: n.name,
      isFolder: n.type === 'folder',
      isHost: n.type !== 'folder',
      isSsh: n.type === 'ssh',
      isRdp: n.type === 'rdp',
      pad: 12 + n.depth * 18,
      rot: 90,
      bg: n.name === selected ? '#262626' : 'transparent'
    }));

    const item = (label, key, hot) => ({ isItem: true, isSep: false, label, key, bg: hot ? '#262626' : 'transparent' });
    const sep = () => ({ isItem: false, isSep: true, label: '', key: '', bg: 'transparent' });

    return {
      accent,
      treeA: tree('Kontrolery domeny'),
      treeB: tree('dc02'),
      menuA: [
        item('Nowy host', 'Ctrl+N', true),
        item('Nowy katalog', 'Ctrl+Shift+N'),
        sep(),
        item('Połącz ze wszystkimi hostami', ''),
        sep(),
        item('Zmień nazwę', 'F2'),
        item('Właściwości katalogu', 'F4'),
        item('Duplikuj', ''),
        sep(),
        item('Usuń', 'Del')
      ],
      menuB: [
        item('Połącz', 'Enter', true),
        item('Połącz w nowej karcie', ''),
        item('Połącz jako inny użytkownik', ''),
        sep(),
        item('Edytuj', 'F4'),
        item('Zmień nazwę', 'F2'),
        item('Duplikuj', ''),
        item('Kopiuj adres', ''),
        sep(),
        item('Usuń', 'Del')
      ]
    };
  }
}
</script>
</body>
</html>
