<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Odblokowanie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 520px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 28px; padding: 48px; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px">

  <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center">
    <svg width="56" height="56" viewBox="0 0 56 56" fill="none" stroke="#EDEDED" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Znak aplikacji">
      <rect x="4" y="4" width="48" height="48" rx="10"/>
      <path d="M17 21l8 7-8 7"/>
      <path d="M30 36h9"/>
    </svg>
    <div style="font-size: 22px; font-weight: 600">MultiRemoteManager</div>
    <div style="color: #A0A0A0">Odblokuj plik z hostami hasłem głównym.</div>
  </div>

  <form style="width: 100%; display: flex; flex-direction: column; gap: 16px" onSubmit="{{ submit }}">
    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="haslo" style="font-size: 13px; font-weight: 500">Hasło główne</label>
      <div style="display: flex; align-items: stretch">
        <input id="haslo" type="{{inputType}}" autocomplete="current-password" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; min-height: 44px; padding: 0 12px; border: 1px solid {{borderColor}}; border-right: 0; border-radius: 6px 0 0 6px; background: #0F0F0F; color: #EDEDED; font-size: 15px">
        <button type="button" aria-label="{{eyeLabel}}" onClick="{{ toggleShow }}" style="display: flex; align-items: center; justify-content: center; width: 48px; border: 1px solid {{borderColor}}; border-radius: 0 6px 6px 0; background: #1C1C1C; cursor: pointer">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        </button>
      </div>
      <sc-if value="{{ showError }}" hint-placeholder-val="{{ false }}">
        <div role="alert" style="font-size: 13px; color: #EDEDED">Nieprawidłowe hasło główne. Spróbuj ponownie.</div>
      </sc-if>
    </div>
    <button type="submit" style="min-height: 44px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 15px; font-weight: 600; cursor: pointer">Odblokuj</button>
  </form>

  <div style="display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center">
    <button type="button" style="min-height: 44px; padding: 0 12px; border: 0; background: transparent; color: #EDEDED; font-size: 13px; text-decoration: underline; cursor: pointer">Utwórz nowy plik z hostami</button>
    <div style="font-size: 12px; color: #A0A0A0">Plik jest szyfrowany lokalnie na tym komputerze.</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":520,"height":560}}'>
class Component extends DCLogic {
  state = { show: false, err: false };

  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';
    const st = this.state;
    return {
      accent,
      inputType: st.show ? 'text' : 'password',
      eyeLabel: st.show ? 'Ukryj hasło' : 'Pokaż hasło',
      showError: st.err,
      borderColor: st.err ? '#EDEDED' : '#3A3A3A',
      toggleShow: () => this.setState({ show: !st.show }),
      submit: (e) => { if (e && e.preventDefault) { e.preventDefault(); } this.setState({ err: true }); }
    };
  }
}
</script>
</body>
</html>
