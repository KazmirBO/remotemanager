<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Pierwsze uruchomienie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 560px; height: 680px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; padding: 20px 28px 16px; border-bottom: 1px solid #2C2C2C">
    <div style="font-size: 18px; font-weight: 600">Witaj w menedżerze sesji</div>
    <div style="margin-top: 4px; color: #A0A0A0">Utwórz zaszyfrowany plik z hostami. Hasło główne chroni wszystkie zapisane dane.</div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: 20px 28px">

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="haslo-glowne" style="font-size: 13px; font-weight: 500">Hasło główne</label>
      <input id="haslo-glowne" type="password" value="przykladowehaslo" readOnly="{{ true }}" style="box-sizing: border-box; width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #0F0F0F; color: #EDEDED; font-size: 14px">
      <div style="display: flex; align-items: center; gap: 10px">
        <div role="meter" aria-label="Siła hasła" aria-valuemin="0" aria-valuemax="4" aria-valuenow="3" style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(4, 1fr); gap: 4px">
          <sc-for list="{{meter}}" as="m" hint-placeholder-count="4">
            <div style="height: 6px; border-radius: 3px; background: {{m.color}}"></div>
          </sc-for>
        </div>
        <span style="flex: none; font-size: 12px; color: #A0A0A0">Dobre</span>
      </div>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <label for="haslo-powtorz" style="font-size: 13px; font-weight: 500">Powtórz hasło</label>
      <input id="haslo-powtorz" type="password" value="przykladowehaslo" readOnly="{{ true }}" style="box-sizing: border-box; width: 100%; min-height: 40px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #0F0F0F; color: #EDEDED; font-size: 14px">
      <span style="font-size: 12px; color: #A0A0A0">Hasła są zgodne.</span>
    </div>

    <div role="alert" style="display: flex; gap: 10px; padding: 12px; border: 1px solid #EDEDED; border-radius: 6px; background: #1C1C1C; font-size: 13px">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#EDEDED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="flex: none; margin-top: 1px"><path d="M12 3l10 18H2z"/><path d="M12 10v5M12 18v.5"/></svg>
      <span>Hasła głównego nie da się odzyskać. Jeśli je zapomnisz, dane w pliku będą nieodwracalnie utracone.</span>
    </div>

    <div style="display: flex; flex-direction: column; gap: 6px">
      <span style="font-size: 13px; font-weight: 500">Lokalizacja pliku</span>
      <div style="display: flex; gap: 8px">
        <input type="text" aria-label="Lokalizacja pliku" value="~/.config/multiremotemanager/hosty.vault" readOnly="{{ true }}" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; min-height: 40px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #0F0F0F; color: #EDEDED; font-family: 'JetBrains Mono', monospace; font-size: 12px">
        <button type="button" style="flex: none; min-height: 40px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer">Zmień</button>
      </div>
    </div>

    <label style="display: flex; align-items: flex-start; gap: 10px">
      <input type="checkbox" defaultChecked="{{ true }}" style="flex: none; width: 16px; height: 16px; margin-top: 2px; accent-color: {{accent}}">
      <span style="display: flex; flex-direction: column; gap: 2px"><span>Synchronizuj plik przez wybrany folder</span><span style="font-size: 12px; color: #A0A0A0">Opcjonalnie, można włączyć później w ustawieniach.</span></span>
    </label>
  </div>

  <div style="flex: none; display: flex; justify-content: flex-end; gap: 8px; padding: 14px 28px; border-top: 1px solid #2C2C2C">
    <button type="button" style="min-height: 38px; padding: 0 16px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; font-weight: 500; cursor: pointer">Otwórz istniejący plik</button>
    <button type="button" style="min-height: 38px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 13px; font-weight: 600; cursor: pointer">Utwórz plik</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":560,"height":680}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';
    return {
      accent,
      meter: [0, 1, 2, 3].map((i) => ({ color: i < 3 ? accent : '#2C2C2C' }))
    };
  }
}
</script>
</body>
</html>
