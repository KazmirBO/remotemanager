<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Zaufane klucze</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 800px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; padding: 14px 24px; border-bottom: 1px solid #2C2C2C">
    <div style="font-size: 16px; font-weight: 600">Zaufane klucze i certyfikaty</div>
    <div style="margin-top: 2px; font-size: 12px; color: #A0A0A0">Odciski zaakceptowane przy pierwszym połączeniu. Zmiana odcisku wywoła ostrzeżenie.</div>
  </div>

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 12px 24px">
    <input type="text" aria-label="Filtruj" placeholder="Filtruj po nazwie hosta lub odcisku" readOnly="{{ true }}" style="flex: 1 1 auto; min-width: 0; box-sizing: border-box; min-height: 36px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #0F0F0F; color: #EDEDED; font-size: 14px">
    <button type="button" style="flex: none; min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer">Usuń zaznaczone</button>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 0 24px">
    <div style="display: grid; grid-template-columns: 24px 130px 60px minmax(0, 1fr) 100px 40px; gap: 12px; align-items: center; min-height: 32px; border-bottom: 1px solid #3A3A3A; font-size: 12px; font-weight: 600; color: #A0A0A0">
      <span></span><span>Host</span><span>Typ</span><span>Odcisk</span><span>Dodano</span><span></span>
    </div>
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
      <div style="display: grid; grid-template-columns: 24px 130px 60px minmax(0, 1fr) 100px 40px; gap: 12px; align-items: center; min-height: 48px; border-bottom: 1px solid #2C2C2C; background: {{r.bg}}">
        <input type="checkbox" aria-label="Zaznacz {{r.host}}" defaultChecked="{{ r.checked }}" style="width: 16px; height: 16px; accent-color: {{accent}}">
        <span style="font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.host}}</span>
        <span style="box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid {{r.badgeBorder}}; border-radius: 3px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 11px; font-weight: 600; text-align: center">{{r.proto}}</span>
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #A0A0A0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap">{{r.fp}}</span>
        <span style="font-size: 13px; color: #A0A0A0">{{r.date}}</span>
        <button type="button" aria-label="Usuń wpis {{r.host}}" style="display: flex; align-items: center; justify-content: center; width: 32px; height: 32px; border: 0; background: transparent; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid #2C2C2C">
    <span style="font-size: 12px; color: #A0A0A0">7 wpisów, 1 zaznaczony</span>
    <button type="button" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 13px; font-weight: 600; cursor: pointer">Zamknij</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":800,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';
    const data = [
      { host: 'zabbix', proto: 'SSH', fp: 'SHA256:4mZ1qT0xYw8bV3nKcLr7Jd2PaE9sUo5hGfX6iBtN1Qk', date: '2026-08-02' },
      { host: 'bastion', proto: 'SSH', fp: 'SHA256:Hq7Lw2VnD9eRzXc1Ty4oUb8KsM3gPjA5fNi0YtCx6Ew', date: '2026-08-02' },
      { host: 'gentoo', proto: 'SSH', fp: 'SHA256:Pb3Jt8WmQ1zLd5Xr9VnKy2UoCe7HgAs4fIi6NxTq0Ra', date: '2026-09-14' },
      { host: 'dc01', proto: 'RDP', fp: 'SHA256:Zk5Ny1Rw7Cq3LbVm9Xd2TeUo8HsJg4AfPi6Kt0QxEb2', date: '2026-08-05' },
      { host: 'veeam', proto: 'RDP', fp: 'SHA256:Ux9Fe4Bn2Sq7TcLw1Vd5RzKy3MoJh8AgPi6Nt0QbXa4', date: '2026-08-05' },
      { host: 'fs02', proto: 'RDP', fp: 'SHA256:Mc6Wj1Gr8Vd3NbXq5Ty9LzKe2UoHs4AfPi7Ct0QxRn3', date: '2026-09-30' },
      { host: 'test-lab', proto: 'SSH', fp: 'SHA256:Ae2Ks7Tv4Nq9XcLb1Rw5DzMy3UoJh8GfPi6Ht0QxCb1', date: '2026-10-03' }
    ];
    const rows = data.map((d, i) => {
      const ssh = d.proto === 'SSH';
      return {
        ...d,
        checked: i === 3,
        bg: i === 3 ? '#262626' : 'transparent',
        badgeBorder: ssh ? accent : '#A0A0A0',
        badgeBg: ssh ? accent : 'transparent',
        badgeFg: ssh ? '#0F0F0F' : '#EDEDED'
      };
    });
    return { accent, rows };
  }
}
</script>
</body>
</html>
