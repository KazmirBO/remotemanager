<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Kopie zapasowe</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="width: 600px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; padding: 16px 24px; border-bottom: 1px solid #2C2C2C">
    <div style="font-size: 16px; font-weight: 600">Kopie zapasowe</div>
    <div style="margin-top: 4px; color: #A0A0A0">Wszystkie kopie są zaszyfrowane hasłem głównym z chwili ich utworzenia.</div>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 4px 24px 16px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #2C2C2C">
      <div style="display: flex; flex-direction: column; gap: 2px"><span>Kopie automatyczne</span><span style="font-size: 12px; color: #A0A0A0">Tworzone przed każdą zmianą hasła i raz dziennie przy zapisie.</span></div>
      <div role="switch" aria-checked="true" aria-label="Kopie automatyczne" style="flex: none; width: 40px; height: 22px; box-sizing: border-box; padding: 2px; border-radius: 4px; background: {{accent}}; display: flex; justify-content: flex-end"><span style="width: 18px; height: 18px; border-radius: 2px; background: #0F0F0F"></span></div>
    </div>
    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 0; border-bottom: 1px solid #2C2C2C">
      <span>Liczba przechowywanych kopii</span>
      <button type="button" aria-haspopup="listbox" style="display: flex; align-items: center; justify-content: space-between; gap: 12px; width: 120px; min-height: 36px; box-sizing: border-box; padding: 0 10px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 14px; cursor: pointer"><span>10</span><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg></button>
    </div>

    <div style="margin-top: 18px; font-size: 14px; font-weight: 600">Dostępne kopie</div>
    <div style="margin-top: 8px; border: 1px solid #2C2C2C; border-radius: 8px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
        <div style="display: grid; grid-template-columns: minmax(0, 1fr) 90px 90px; gap: 12px; align-items: center; min-height: 48px; padding: 0 12px; background: {{r.bg}}; border-top: {{r.top}}">
          <div style="display: flex; flex-direction: column; min-width: 0"><span style="font-size: 13px; font-weight: 500">{{r.when}}</span><span style="font-size: 12px; color: #A0A0A0">{{r.why}}</span></div>
          <span style="font-size: 12px; color: #A0A0A0; text-align: right">{{r.size}}</span>
          <button type="button" style="min-height: 28px; border: 1px solid #3A3A3A; border-radius: 6px; background: transparent; color: #EDEDED; font-size: 12px; cursor: pointer">Przywróć</button>
        </div>
      </sc-for>
    </div>

    <div style="margin-top: 18px; display: flex; flex-wrap: wrap; gap: 8px">
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 16V4M7 9l5-5 5 5M5 20h14"/></svg>Eksportuj kopię...</button>
      <button type="button" style="display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v12M7 11l5 5 5-5M5 20h14"/></svg>Przywróć z pliku...</button>
    </div>
  </div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 24px; border-top: 1px solid #2C2C2C">
    <span style="font-size: 12px; color: #A0A0A0">Folder kopii: ~/.config/multiremotemanager/kopie</span>
    <button type="button" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 13px; font-weight: 600; cursor: pointer">Zamknij</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":600,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      { when: '2026-10-12 08:14', why: 'Przed zmianą hasła głównego', size: '48 KB' },
      { when: '2026-10-11 21:40', why: 'Kopia dzienna', size: '47 KB' },
      { when: '2026-10-10 19:02', why: 'Kopia dzienna', size: '45 KB' },
      { when: '2026-10-09 07:55', why: 'Kopia dzienna', size: '45 KB' },
      { when: '2026-10-08 20:31', why: 'Kopia dzienna', size: '44 KB' }
    ];
    const rows = data.map((d, i) => ({ ...d, bg: i === 0 ? '#262626' : 'transparent', top: i === 0 ? '0 solid transparent' : '1px solid #2C2C2C' }));
    return { accent: this.props.accent ?? '#EDEDED', rows };
  }
}
</script>
</body>
</html>
