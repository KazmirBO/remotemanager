<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Schematy terminala</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;700&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
</style>
</helmet>
<div style="width: 1120px; height: 700px; box-sizing: border-box; display: flex; flex-direction: column; gap: 24px; padding: 40px; background: #0F0F0F; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px">

  <div>
    <div style="font-size: 16px; font-weight: 600">Schematy kolorów terminala</div>
    <div style="margin-top: 4px; font-size: 13px; color: #A0A0A0">Przy palecie w skali szarości kolory ANSI przestają się różnić. Rozróżnienie niosą pogrubienie, podkreślenie, kursywa i odwrócenie, które można włączyć poniżej.</div>
  </div>

  <div style="flex: 1 1 auto; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 40px; min-height: 0">
    <sc-for list="{{schemes}}" as="s" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 10px; min-width: 0">
        <div style="display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600"><span style="width: 14px; height: 14px; box-sizing: border-box; border: 2px solid #EDEDED; border-radius: 50%; background: {{s.dot}}"></span>{{s.name}}</div>
        <div style="display: grid; grid-template-columns: repeat(8, 1fr); gap: 3px">
          <sc-for list="{{s.pal}}" as="c" hint-placeholder-count="16"><div style="height: 24px; border: 1px solid #3A3A3A; background: {{c}}"></div></sc-for>
        </div>
        <div style="flex: 1 1 auto; box-sizing: border-box; padding: 12px; border: 1px solid {{s.frame}}; background: {{s.bg}}; color: {{s.fg}}; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 19px; overflow: hidden">
          <sc-for list="{{s.lines}}" as="ln" hint-placeholder-count="9">
            <div style="white-space: pre; min-height: 19px"><sc-for list="{{ln}}" as="g" hint-placeholder-count="2"><span style="color: {{g.fg}}; background: {{g.bg}}; font-weight: {{g.fw}}; font-style: {{g.fs}}; text-decoration: {{g.td}}">{{g.t}}</span></sc-for></div>
          </sc-for>
        </div>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; flex-wrap: wrap; gap: 8px 32px; padding-top: 16px; border-top: 1px solid #2C2C2C; font-size: 13px">
    <sc-for list="{{opts}}" as="o" hint-placeholder-count="4">
      <label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" defaultChecked="{{ o.on }}" style="width: 15px; height: 15px; accent-color: {{accent}}">{{o.label}}</label>
    </sc-for>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":1120,"height":700}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';
    const mk = (bg, fg, pal, dim, sel) => {
      const g = (t, o) => ({ t, fg: fg, bg: 'transparent', fw: 400, fs: 'normal', td: 'none', ...(o || {}) });
      const P = (i) => pal[i];
      return {
        bg, fg, pal, frame: '#3A3A3A',
        lines: [
          [g('sebastian@yggdrasil', { fw: 700 }), g(':'), g('~/projekty', { fw: 700, td: 'underline' }), g('$ ls -la')],
          [g('drwxr-xr-x', { fg: dim }), g('  src', { fw: 700, td: 'underline' })],
          [g('-rwxr-xr-x', { fg: dim }), g('  build.sh', { fw: 700 })],
          [g('lrwxrwxrwx', { fg: dim }), g('  config -> /etc', { fs: 'italic' })],
          [g('-rw-r--r--', { fg: dim }), g('  README.md')],
          [g('$ git diff --stat')],
          [g('  src/main.rs | 12 '), g('+++++', { fw: 700 }), g('-----', { fg: dim })],
          [g('$ grep -n ', {}), g('blad', { bg: sel, fg: bg }), g(' dziennik.log')],
          [g('$ '), g(' ', { bg: fg })]
        ]
      };
    };
    const dark = ['#1C1C1C','#6E6E6E','#8A8A8A','#A6A6A6','#BEBEBE','#D0D0D0','#DEDEDE','#EDEDED','#3A3A3A','#8E8E8E','#ABABAB','#C4C4C4','#D8D8D8','#E6E6E6','#F2F2F2','#FFFFFF'];
    const paper = ['#FFFFFF','#8A8A8A','#707070','#595959','#454545','#333333','#262626','#1A1A1A','#C8C8C8','#7A7A7A','#5E5E5E','#4A4A4A','#383838','#2A2A2A','#1E1E1E','#000000'];
    const hc = ['#000000','#7F7F7F','#999999','#B3B3B3','#CCCCCC','#E0E0E0','#F0F0F0','#FFFFFF','#333333','#8C8C8C','#A6A6A6','#C0C0C0','#D6D6D6','#E8E8E8','#F5F5F5','#FFFFFF'];
    const schemes = [
      { name: 'Grafit (domyślny)', dot: '#EDEDED', ...mk('#0A0A0A', '#EDEDED', dark, '#A0A0A0', '#EDEDED') },
      { name: 'Papier', dot: 'transparent', ...mk('#FFFFFF', '#1A1A1A', paper, '#5E5E5E', '#1A1A1A') },
      { name: 'Wysoki kontrast', dot: 'transparent', ...mk('#000000', '#FFFFFF', hc, '#B3B3B3', '#FFFFFF') }
    ];
    const opts = [
      { label: 'Pogrubiaj jasne kolory (bright)', on: true },
      { label: 'Podkreślaj katalogi', on: true },
      { label: 'Kursywa dla dowiązań', on: true },
      { label: 'Minimalny kontrast 4,5:1', on: true }
    ];
    return { accent, schemes, opts };
  }
}
</script>
</body>
</html>
