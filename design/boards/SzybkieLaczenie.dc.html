<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Szybkie łączenie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
input{font-family:inherit}
.row:hover{background:#1C1C1C}
</style>
</helmet>
<div style="width: 640px; height: 480px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; display: flex; align-items: center; gap: 12px; padding: 0 18px; min-height: 56px; border-bottom: 1px solid #2C2C2C">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#A0A0A0" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>
    <input type="text" aria-label="Szukaj hosta lub wpisz adres" value="za" readOnly="{{ true }}" placeholder="Szukaj hosta lub wpisz user@adres" style="flex: 1 1 auto; min-width: 0; border: 0; outline: 0; background: transparent; color: #EDEDED; font-size: 16px">
    <kbd style="flex: none; padding: 2px 6px; border: 1px solid #3A3A3A; border-radius: 4px; font-family: inherit; font-size: 11px; color: #A0A0A0">Esc</kbd>
  </div>

  <div role="listbox" aria-label="Wyniki" style="flex: 1 1 auto; min-height: 0; overflow-y: auto; padding: 8px">
    <sc-for list="{{rows}}" as="r" hint-placeholder-count="5">
      <div class="row" role="option" aria-selected="{{r.selAria}}" style="display: flex; align-items: center; gap: 12px; padding: 0 12px; min-height: 48px; border-radius: 6px; background: {{r.bg}}; cursor: pointer">
        <span style="flex: none; box-sizing: border-box; min-width: 38px; padding: 1px 5px; border: 1px solid {{r.badgeBorder}}; border-radius: 3px; background: {{r.badgeBg}}; color: {{r.badgeFg}}; font-size: 11px; font-weight: 600; text-align: center">{{r.proto}}</span>
        <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column">
          <span style="font-weight: 500">{{r.name}}</span>
          <span style="font-size: 12px; color: #A0A0A0">{{r.path}}</span>
        </div>
        <span style="flex: none; font-size: 12px; color: #A0A0A0">{{r.hint}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 6px 18px; padding: 10px 18px; border-top: 1px solid #2C2C2C; font-size: 12px; color: #A0A0A0">
    <span>Enter: połącz</span>
    <span>Ctrl+Enter: nowa karta</span>
    <span>Strzałki: wybór</span>
    <span>Wpisz adres, aby połączyć się bez zapisywania</span>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":640,"height":480}}'>
class Component extends DCLogic {
  renderVals() {
    const accent = this.props.accent ?? '#EDEDED';
    const data = [
      { proto: 'SSH', name: 'zabbix', path: 'FIRMA / Monitoring', hint: 'Ostatnio' },
      { proto: 'SSH', name: 'bastion', path: 'FIRMA / Infrastruktura', hint: 'Ulubione' },
      { proto: 'RDP', name: 'dc01', path: 'FIRMA / Serwery Windows', hint: '' },
      { proto: 'RDP', name: 'veeam', path: 'FIRMA / Kopie zapasowe', hint: '' },
      { proto: 'SSH', name: 'gentoo', path: 'Prywatne', hint: '' }
    ];
    const rows = data.map((d, i) => {
      const ssh = d.proto === 'SSH';
      return {
        ...d,
        selAria: i === 0 ? 'true' : 'false',
        bg: i === 0 ? '#262626' : 'transparent',
        badgeBorder: ssh ? accent : '#A0A0A0',
        badgeBg: ssh ? accent : 'transparent',
        badgeFg: ssh ? '#0F0F0F' : '#EDEDED'
      };
    });
    return { rows };
  }
}
</script>
</body>
</html>
