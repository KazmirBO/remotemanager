<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>Dziennik diagnostyczny</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
input{font-family:inherit}
</style>
</helmet>
<div style="width: 880px; height: 560px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: none; padding: 14px 24px; border-bottom: 1px solid #2C2C2C">
    <div style="font-size: 16px; font-weight: 600">Dziennik diagnostyczny</div>
    <div style="margin-top: 2px; font-size: 12px; color: #A0A0A0">Hasła, klucze prywatne i zawartość sesji nie są zapisywane w tym dzienniku.</div>
  </div>

  <div style="flex: none; display: flex; flex-wrap: wrap; align-items: center; gap: 10px; padding: 10px 24px; border-bottom: 1px solid #2C2C2C">
    <div role="group" aria-label="Poziom" style="display: flex; border: 1px solid #3A3A3A; border-radius: 6px; overflow: hidden">
      <sc-for list="{{levels}}" as="l" hint-placeholder-count="4">
        <span style="padding: 0 12px; min-height: 32px; display: flex; align-items: center; font-size: 13px; background: {{l.bg}}; border-left: {{l.left}}">{{l.label}}</span>
      </sc-for>
    </div>
    <input type="text" aria-label="Szukaj w dzienniku" placeholder="Szukaj w dzienniku" readOnly="{{ true }}" style="flex: 1 1 200px; min-width: 0; box-sizing: border-box; min-height: 32px; padding: 0 10px; border: 1px solid #3A3A3A; border-radius: 6px; background: #0F0F0F; color: #EDEDED; font-size: 13px">
    <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer">Kopiuj</button>
    <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer">Zapisz do pliku...</button>
    <button type="button" style="min-height: 32px; padding: 0 12px; border: 1px solid #3A3A3A; border-radius: 6px; background: transparent; color: #EDEDED; font-size: 13px; cursor: pointer">Wyczyść</button>
  </div>

  <div style="flex: 1 1 auto; min-height: 0; overflow-y: auto; background: #0A0A0A; padding: 8px 0; font-family: 'JetBrains Mono', monospace; font-size: 12px; line-height: 20px">
    <sc-for list="{{lines}}" as="l" hint-placeholder-count="12">
      <div style="display: grid; grid-template-columns: 150px 52px minmax(0, 1fr); gap: 12px; padding: 0 24px; background: {{l.bg}}">
        <span style="color: #A0A0A0">{{l.time}}</span>
        <span style="font-weight: {{l.fw}}; color: {{l.fg}}">{{l.level}}</span>
        <span>{{l.msg}}</span>
      </div>
    </sc-for>
  </div>

  <div style="flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 10px 24px; border-top: 1px solid #2C2C2C; font-size: 12px; color: #A0A0A0">
    <span>12 wpisów, 2 ostrzeżenia, 1 błąd</span>
    <label style="display: flex; align-items: center; gap: 8px"><input type="checkbox" defaultChecked="{{ true }}" style="width: 14px; height: 14px; accent-color: {{accent}}">Przewijaj automatycznie</label>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":880,"height":560}}'>
class Component extends DCLogic {
  renderVals() {
    const levels = ['Wszystko', 'Info', 'Ostrzeżenia', 'Błędy'].map((label, i) => ({ label, bg: i === 0 ? '#262626' : 'transparent', left: i === 0 ? '0 solid transparent' : '1px solid #3A3A3A' }));
    const raw = [
      ['14:30:02.114', 'INFO', 'Odblokowano plik hosty.vault (format 2)'],
      ['14:30:02.380', 'INFO', 'Załadowano 14 hostów w 4 katalogach'],
      ['14:31:10.020', 'INFO', 'ssh zabbix: łączenie przez bastion'],
      ['14:31:10.642', 'INFO', 'ssh bastion: uwierzytelnienie agentem, klucz ed25519'],
      ['14:31:11.007', 'INFO', 'ssh zabbix: sesja otwarta'],
      ['14:32:44.501', 'INFO', 'rdp dc01: negocjacja NLA (Negotiate)'],
      ['14:32:45.230', 'WARN', 'rdp dc01: certyfikat serwera niezaufany, zapytano użytkownika'],
      ['14:32:48.770', 'INFO', 'rdp dc01: połączono, 1920x1080'],
      ['14:41:03.115', 'WARN', 'rdp veeam: opóźnienie ponad 400 ms'],
      ['14:41:09.882', 'ERROR', 'rdp veeam: połączenie zerwane (timeout), próba 1 z 5'],
      ['14:41:17.900', 'INFO', 'rdp veeam: ponowne połączenie udane'],
      ['14:55:00.004', 'INFO', 'Zapisano plik hosty.vault, utworzono kopię dzienną']
    ];
    const lines = raw.map((r, i) => ({ time: '2026-10-12 ' + r[0], level: r[1], msg: r[2],
      fw: r[1] === 'INFO' ? 400 : 600, fg: r[1] === 'INFO' ? '#A0A0A0' : '#EDEDED', bg: r[1] === 'ERROR' ? '#262626' : 'transparent' }));
    return { accent: this.props.accent ?? '#EDEDED', levels, lines };
  }
}
</script>
</body>
</html>
