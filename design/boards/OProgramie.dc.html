<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<title>O programie</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
body{margin:0}
button{font-family:inherit}
button:hover{filter:brightness(1.15)}
</style>
</helmet>
<div style="width: 480px; height: 460px; box-sizing: border-box; display: flex; flex-direction: column; background: #161616; color: #EDEDED; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 14px; border: 1px solid #3A3A3A; border-radius: 10px; overflow: hidden">

  <div style="flex: 1 1 auto; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 32px 28px 16px; text-align: center">
    <svg width="72" height="72" viewBox="0 0 128 128" role="img" aria-label="Ikona programu">
      <rect x="4" y="4" width="120" height="120" rx="28" fill="#EDEDED"/>
      <rect x="28" y="32" width="72" height="50" rx="6" fill="none" stroke="#0F0F0F" stroke-width="8"/>
      <path d="M64 82v16M46 98h36" fill="none" stroke="#0F0F0F" stroke-width="8" stroke-linecap="round"/>
      <path d="M44 48l12 9-12 9M62 66h14" fill="none" stroke="#0F0F0F" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
    <div style="font-size: 20px; font-weight: 600">Menedżer sesji</div>
    <div style="color: #A0A0A0">Sesje SSH i RDP w jednym oknie</div>
    <div style="margin-top: 6px; font-size: 13px">Wersja 0.1.0 (kompilacja z 2026-10-12)</div>

    <div style="width: 100%; margin-top: 12px; text-align: left; border: 1px solid #2C2C2C; border-radius: 8px; overflow: hidden">
      <sc-for list="{{rows}}" as="r" hint-placeholder-count="4">
        <div style="display: flex; justify-content: space-between; gap: 12px; min-height: 34px; align-items: center; padding: 0 12px; border-top: {{r.top}}; font-size: 13px"><span style="color: #A0A0A0">{{r.k}}</span><span>{{r.v}}</span></div>
      </sc-for>
    </div>
  </div>

  <div style="flex: none; display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding: 14px 24px; border-top: 1px solid #2C2C2C">
    <div style="display: flex; gap: 8px">
      <button type="button" style="min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: #1C1C1C; color: #EDEDED; font-size: 13px; cursor: pointer">Kopiuj informacje o wersji</button>
      <button type="button" style="min-height: 36px; padding: 0 14px; border: 1px solid #3A3A3A; border-radius: 6px; background: transparent; color: #EDEDED; font-size: 13px; cursor: pointer">Licencje składników</button>
    </div>
    <button type="button" style="min-height: 36px; padding: 0 18px; border: 0; border-radius: 6px; background: {{accent}}; color: #0F0F0F; font-size: 13px; font-weight: 600; cursor: pointer">Zamknij</button>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"accent":{"editor":"color","default":"#EDEDED"},"$preview":{"width":480,"height":460}}'>
class Component extends DCLogic {
  renderVals() {
    const data = [
      ['System', 'Gentoo Linux, x86_64'],
      ['Silnik interfejsu', 'Tauri (WebKitGTK)'],
      ['Terminal', 'xterm.js'],
      ['Klient RDP', 'IronRDP']
    ];
    return { accent: this.props.accent ?? '#EDEDED', rows: data.map((d, i) => ({ k: d[0], v: d[1], top: i === 0 ? '0 solid transparent' : '1px solid #2C2C2C' })) };
  }
}
</script>
</body>
</html>
