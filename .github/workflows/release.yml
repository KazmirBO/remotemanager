name: wydanie
# Buduje pakiety instalacyjne (deb i instalator NSIS) skryptem scripts/build-release.sh.
# Uruchomiony ręcznie z gałęzi main tworzy tag v<wersja> i wydanie na GitHubie z plikami oraz opisem
# z CHANGELOG.md; wersja pochodzi z crates/app/tauri.conf.json. W pull requeście, który zmienia
# pakowanie, robi tylko próbną budowę, bez tagu i wydania.
on:
  workflow_dispatch:
    inputs:
      prerelease:
        description: Oznacz jako wydanie wstępne
        type: boolean
        default: true
  pull_request:
    paths:
      - .github/workflows/release.yml
      - scripts/build-release.sh
      - packaging/**
      - crates/app/tauri.conf.json
permissions:
  contents: read
jobs:
  build:
    strategy:
      # Błąd na jednym systemie nie przerywa drugiego: wynik obu jest potrzebny osobno.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundle: deb
          - os: windows-latest
            bundle: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: app/ui/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Pakowanie (inaczej niż sama kompilacja) wymaga biblioteki appindicator widocznej przez pkg-config:
      # Tauri dopisuje ją do zależności pakietu deb z powodu ikony w zasobniku.
      - name: Zależności systemowe Tauri (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libsoup-3.0-dev libayatana-appindicator3-dev
      - name: Budowa pakietu
        shell: bash
        run: bash scripts/build-release.sh --bundles ${{ matrix.bundle }}
      # Nazwa produktu ma polskie znaki i spację; pliki wydania dostają nazwy ASCII.
      - name: Pliki wydania
        shell: bash
        run: |
          version="$(sed -n 's/^ *"version": "\(.*\)",$/\1/p' crates/app/tauri.conf.json | head -n 1)"
          test -n "$version"
          mkdir -p dist
          case "${{ matrix.bundle }}" in
            deb) cp target/release/bundle/deb/*.deb "dist/multiremotemanager_${version}_amd64.deb" ;;
            nsis) cp target/release/bundle/nsis/*.exe "dist/multiremotemanager_${version}_x64-setup.exe" ;;
          esac
          ls -l dist
      - uses: actions/upload-artifact@v4
        with:
          name: pakiet-${{ matrix.bundle }}
          path: dist/*
          if-no-files-found: error
  release:
    # Tag i wydanie powstają tylko przy ręcznym uruchomieniu z gałęzi main.
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Tag i wydanie
        env:
          GH_TOKEN: ${{ github.token }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          version="$(sed -n 's/^ *"version": "\(.*\)",$/\1/p' crates/app/tauri.conf.json | head -n 1)"
          test -n "$version"
          # Opis wydania to sekcja tej wersji z CHANGELOG.md (od nagłówka "## <wersja>" do następnego "## ").
          awk -v v="$version" 'index($0, "## " v) == 1 { p = 1; next } /^## / { p = 0 } p' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "Brak sekcji $version w CHANGELOG.md" >&2
            exit 1
          fi
          flags=()
          if [ "$PRERELEASE" = "true" ]; then
            flags+=(--prerelease)
          fi
          ls -l dist
          gh release create "v$version" dist/* \
            --target "$GITHUB_SHA" \
            --title "Menedżer sesji $version" \
            --notes-file notes.md \
            "${flags[@]}"
